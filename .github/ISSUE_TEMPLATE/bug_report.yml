name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: zotero-version
    attributes:
      label: Zotero version
      placeholder: "9.0.5"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS, Linux"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "version number"
    validations:
      required: true
  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      description: Name and version of the agent or desktop client.
      placeholder: "Codex, Claude Code, OpenCode, Claude Desktop"
    validations:
      required: true
  - type: dropdown
    id: connection-type
    attributes:
      label: Connection type
      options:
        - Streamable HTTP
        - stdio adapter
        - Claude Desktop MCPB
        - Not sure
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor result
      description: Run `zotero-local-mcp-bridge-stdio doctor` while Zotero is open. Remove private paths before posting.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include MCP tool names or commands, but remove private data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove tokens, confirmation data, private library data, full local paths, and document content before posting.
      render: text
