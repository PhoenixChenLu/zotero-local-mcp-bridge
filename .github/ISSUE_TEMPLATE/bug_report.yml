name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: zotero-version
    attributes:
      label: Zotero version
      placeholder: "9.0.5"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS, Linux"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "version number"
    validations:
      required: true
  - type: dropdown
    id: profile-type
    attributes:
      label: Profile type
      options:
        - Clean profile
        - Real profile
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include MCP tool names or commands, but remove private data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove tokens, private library data, and local private paths before posting.
      render: text
