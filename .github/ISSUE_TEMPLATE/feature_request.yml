name: Feature request
description: Suggest a Zotero or MCP capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the bridge do?
    validations:
      required: true
  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      description: Which agent or desktop client should support this workflow?
      placeholder: "Codex, Claude Code, OpenCode, Claude Desktop, any MCP client"
  - type: dropdown
    id: risk
    attributes:
      label: Write risk
      options:
        - Read-only
        - Writes Zotero metadata
        - Writes or moves files
        - Trash or merge behavior
        - Not sure
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety expectations
      description: What should dry-run, confirmation, audit, backup, or undo show?
